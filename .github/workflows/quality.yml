name: BahnConnections quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm audit:realtime
      - run: pnpm audit:ui
      - run: pnpm audit:billing
      - run: pnpm audit:board
      - run: pnpm audit:transport
      - run: pnpm audit:map
      - run: pnpm build
      - name: Responsive interaction and realtime screenshots
        env:
          EDGE_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p work/mobile-qa
          node node_modules/vinext/dist/cli.js dev > work/bahnconnections-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/ > /dev/null
          pnpm audit:layout -- http://localhost:3000/?station=berlin work/layout-qa
          pnpm audit:mobile -- http://localhost:3000 work/mobile-qa
          pnpm audit:layout -- 'http://localhost:3000/?station=berlin' work/station-loading-qa --station-loading-only
          node scripts/station-sheet-qa.mjs http://localhost:3000 work/station-sheet-qa
      - name: Live network sources
        continue-on-error: true
        run: timeout 180 pnpm audit:network > work/network-audit.json 2>&1
      - name: Live API smoke
        continue-on-error: true
        run: |
          node node_modules/vinext/dist/cli.js dev > work/api-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          BAHNCONNECTIONS_BASE_URL=http://localhost:3000 timeout 180 pnpm audit:api > work/api-smoke.json 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-qa
          path: |
            work/mobile-qa/
            work/layout-qa/
            work/station-sheet-qa/
            work/station-loading-qa/
            work/bahnconnections-dev.log
            work/network-audit.json
            work/api-smoke.json
            work/api-dev.log

      # Smaller evidence bundles can be inspected in tools with a 32 MiB transfer limit.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-phone-compact
          path: |
            work/mobile-qa/320-*.png
            work/mobile-qa/360-*.png
            work/mobile-qa/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-phone-standard
          path: |
            work/mobile-qa/390-*.png
            work/mobile-qa/430-*.png
            work/mobile-qa/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-tablet
          path: |
            work/mobile-qa/768-*.png
            work/mobile-qa/1024-*.png
            work/mobile-qa/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-desktop-light
          path: |
            work/mobile-qa/1440-light-*.png
            work/mobile-qa/1920-light-*.png
            work/mobile-qa/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-desktop-dark
          path: |
            work/mobile-qa/1440-dark-*.png
            work/mobile-qa/1920-dark-*.png
            work/mobile-qa/report.json
