name: Android TWA

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Validate signed release AAB with throwaway CI key
        run: |
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/ci-upload.jks"             -storepass ci-test-only             -keypass ci-test-only             -alias ci-upload             -keyalg RSA             -keysize 2048             -validity 365             -dname "CN=BahnConnections CI, O=BahnConnections, C=DE"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ci-upload.jks"           ANDROID_KEYSTORE_PASSWORD="ci-test-only"           ANDROID_KEY_ALIAS="ci-upload"           ANDROID_KEY_PASSWORD="ci-test-only"           gradle -p android :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bahnconnections-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bahnconnections-ci-validation-aab-not-for-play
          path: android/app/build/outputs/bundle/release/app-release.aab

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-key.jks
      - name: Build signed App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle -p android :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bahnconnections-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
