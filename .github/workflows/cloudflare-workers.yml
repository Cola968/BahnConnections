name: Standalone Cloudflare Workers

on:
  pull_request:
    paths:
      - "vite.cloudflare.config.ts"
      - "wrangler.cloudflare.jsonc"
      - "scripts/cloudflare-*.mjs"
      - ".github/workflows/cloudflare-workers.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/deploy/CLOUDFLARE-WORKERS.md"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "vite.cloudflare.config.ts"
      - "wrangler.cloudflare.jsonc"
      - "scripts/cloudflare-*.mjs"
      - ".github/workflows/cloudflare-workers.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      publish:
        description: "I have approved the data rights and want to publish on Cloudflare Workers"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate standalone Worker (no Cloudflare credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:cloudflare
      - run: pnpm exec tsc --noEmit
      - run: pnpm build:cloudflare
      - name: Validate generated Worker bundle and dry-run deploy
        run: |
          config_path="$(node scripts/cloudflare-output-config.mjs)"
          test -f "$config_path"
          pnpm exec wrangler deploy --config "$config_path" --dry-run --outdir .wrangler/cloudflare-dry-run

  deploy:
    name: Publish standalone Worker (opt-in)
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
      (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:cloudflare
      - run: pnpm build:cloudflare
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN as a GitHub Actions secret; CLOUDFLARE_ACCOUNT_ID is already configured as a repository variable."
            exit 1
          fi
          config_path="$(node scripts/cloudflare-output-config.mjs)"
          pnpm exec wrangler deploy --config "$config_path"
      - name: Check public Workers URL if configured
        env:
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          if [ -z "$CLOUDFLARE_WORKER_URL" ]; then
            echo "::notice::Set repository variable CLOUDFLARE_WORKER_URL after the first deploy to verify /version.json automatically."
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20             "${CLOUDFLARE_WORKER_URL%/}/version.json" |
            node -e 'let text="";process.stdin.on("data",x=>text+=x);process.stdin.on("end",()=>{const v=JSON.parse(text),expected=require("./public/version.json");if(v.version!==expected.version)process.exit(1);console.log("BahnConnections "+v.label+" deployed");})'
