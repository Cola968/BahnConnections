name: Render availability monitor

# A best-effort lightweight request before Render's 15-minute inactivity window.
# Scheduled Actions can start late, so this is NOT an always-on hosting guarantee.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-availability-monitor
  cancel-in-progress: true

jobs:
  check:
    name: Check BahnConnections website
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public version endpoint
        env:
          RENDER_URL: https://bahnconnections-v55.onrender.com
        run: |
          set -euo pipefail
          base="${RENDER_URL%/}"
          output="$(mktemp)"
          # A real HTTP request is the only supported wake trigger; do not fake "ready".
          if ! curl --fail --silent --show-error --location --connect-timeout 10 --max-time 110 --retry 1 --retry-delay 5 \
             "${base}/version.json" -o "$output"; then
            echo "::warning::Render service could not answer after the wake-up window."
            exit 1
          fi
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!/^[0-9]+[.][0-9]+/.test(String(v.version??"")))process.exit(1); console.log("BahnConnections V"+v.version+" responded.");' "$output"
