plugins { id 'com.android.application' }
def hasReleaseSigning=System.getenv("ANDROID_KEYSTORE_PATH")&&System.getenv("ANDROID_KEYSTORE_PASSWORD")&&System.getenv("ANDROID_KEY_ALIAS")&&System.getenv("ANDROID_KEY_PASSWORD")
android {
    namespace 'de.bahnconnections.app'
    compileSdk 36
    defaultConfig { applicationId 'de.bahnconnections.app'; minSdk 24; targetSdk 36; versionCode 4701; versionName '47.1' }
    if(hasReleaseSigning){ signingConfigs { release { storeFile file(System.getenv("ANDROID_KEYSTORE_PATH")); storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD"); keyAlias System.getenv("ANDROID_KEY_ALIAS"); keyPassword System.getenv("ANDROID_KEY_PASSWORD") } } }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; if(hasReleaseSigning){ signingConfig signingConfigs.release } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3' }
